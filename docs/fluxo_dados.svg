<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #2C2C2A; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .h { font-size: 15px; font-weight: 700; fill: #6B6A65; letter-spacing: 1.5px; }
      .sub { font-size: 14px; fill: #5F5E5A; }
      .peq { font-size: 12px; fill: #5F5E5A; }
      .fluxo { fill: none; stroke: #5F5E5A; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Título -->
  <text x="40" y="70" style="font-size:36px;font-weight:700">Caminho dos dados: da entrada à saída</text>
  <text x="40" y="106" style="font-size:18px;fill:#5F5E5A">Simulador de Zeros de Funções — por quais funções cada dado passa até virar tabela e gráfico</text>

  <!-- Cabeçalhos das colunas -->
  <g text-anchor="middle">
    <text class="h" x="165" y="180">1 · ENTRADA</text>
    <text class="h" x="515" y="180">2 · MONTAGEM DO CASO</text>
    <text class="h" x="840" y="180">3 · PREPARAÇÃO</text>
    <text class="h" x="1170" y="180">4 · MÉTODOS</text>
    <text class="h" x="1485" y="180">5 · RESULTADO</text>
    <text class="h" x="1770" y="180">6 · SAÍDA</text>
  </g>

  <!-- ===== Setas (atrás das caixas) ===== -->
  <g class="fluxo" marker-end="url(#seta)">
    <!-- usuário -> main -->
    <path d="M165 370 L165 448"/>
    <!-- main -> 3 ramos -->
    <path d="M290 515 C335 515 335 260 378 260"/>
    <path d="M290 515 C335 515 335 512 378 512"/>
    <path d="M290 515 C335 515 335 765 378 765"/>
    <!-- 3 ramos -> executar_comparacao -->
    <path d="M650 260 C680 260 680 385 708 385"/>
    <path d="M650 512 C680 512 680 385 708 385"/>
    <path d="M650 765 C680 765 680 385 708 385"/>
    <!-- executar -> ler_funcao -->
    <path d="M840 440 L840 498"/>
    <!-- ler_funcao -> rodar_com_seguranca -->
    <path d="M970 575 C1000 575 1000 520 1028 520"/>
    <!-- métodos -> Resultado -->
    <path d="M1290 333 C1330 333 1330 470 1368 470"/>
    <path d="M1290 415 C1330 415 1330 470 1368 470"/>
    <path d="M1290 525 C1330 525 1330 470 1368 470"/>
    <path d="M1290 607 C1330 607 1330 470 1368 470"/>
    <!-- Resultado -> saídas -->
    <path d="M1600 470 C1630 470 1630 270 1658 270"/>
    <path d="M1600 470 L1658 470"/>
    <!-- coluna de saída -->
    <path d="M1770 310 L1770 328"/>
    <path d="M1770 505 L1770 523"/>
    <path d="M1770 585 L1770 603"/>
    <path d="M1770 715 L1770 733"/>
  </g>
  <text x="1000" y="556" text-anchor="middle" class="peq mono">f, f'</text>

  <!-- ===== 1 · ENTRADA ===== -->
  <rect x="65" y="320" width="200" height="50" rx="25" fill="#2C2C2A"/>
  <text x="165" y="351" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#FFFFFF">Usuário digita</text>

  <rect x="40" y="450" width="250" height="130" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <g text-anchor="middle">
    <text class="mono" x="165" y="497" style="font-size:26px;font-weight:700;fill:#3C3489">main()</text>
    <text x="165" y="527" style="font-size:16px;fill:#3C3489">Menu no terminal</text>
    <text x="165" y="553" class="sub">caso pronto, digitar ou sair</text>
  </g>

  <!-- ===== 2 · MONTAGEM DO CASO ===== -->
  <!-- caso pronto -->
  <rect x="380" y="200" width="270" height="120" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="2"/>
  <g text-anchor="middle">
    <text class="mono" x="515" y="243" style="font-size:22px;font-weight:700;fill:#444441">CASOS[i]</text>
    <text x="515" y="270" class="sub">casos.py · caso pronto</text>
    <text x="515" y="294" class="sub">f em texto, a, b, x0, x1</text>
  </g>

  <!-- caso personalizado -->
  <rect x="380" y="370" width="270" height="285" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <g text-anchor="middle">
    <text class="mono" x="515" y="405" style="font-size:19px;font-weight:700;fill:#3C3489">montar_caso_</text>
    <text class="mono" x="515" y="430" style="font-size:19px;font-weight:700;fill:#3C3489">personalizado()</text>
  </g>
  <g text-anchor="middle">
    <rect x="400" y="450" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
    <text class="mono" x="515" y="474" style="font-size:15px;font-weight:700;fill:#0C447C">ler_funcao(texto)</text>
    <text x="515" y="495" class="peq">valida a função digitada</text>
    <rect x="400" y="516" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
    <text class="mono" x="515" y="540" style="font-size:15px;font-weight:700;fill:#0C447C">ler_float(a), (b)</text>
    <text x="515" y="561" class="peq">intervalo e troca de sinal</text>
    <rect x="400" y="582" width="230" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
    <text class="mono" x="515" y="606" style="font-size:15px;font-weight:700;fill:#0C447C">ler_float(x0, x1)</text>
    <text x="515" y="627" class="peq">chutes iniciais (Enter = a, b)</text>
  </g>

  <!-- parâmetros -->
  <rect x="380" y="700" width="270" height="130" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
  <g text-anchor="middle">
    <text class="mono" x="515" y="740" style="font-size:18px;font-weight:700;fill:#0C447C">ler_float(eps)</text>
    <text class="mono" x="515" y="765" style="font-size:18px;font-weight:700;fill:#0C447C">ler_int(max_iter)</text>
    <text x="515" y="792" class="sub">precisão e limite de iterações</text>
    <text x="515" y="814" class="peq">Enter = 1e-6 e 100</text>
  </g>

  <!-- ===== 3 · PREPARAÇÃO ===== -->
  <rect x="710" y="330" width="260" height="110" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <g text-anchor="middle">
    <text class="mono" x="840" y="368" style="font-size:19px;font-weight:700;fill:#3C3489">executar_</text>
    <text class="mono" x="840" y="392" style="font-size:19px;font-weight:700;fill:#3C3489">comparacao()</text>
    <text x="840" y="420" class="peq">recebe caso, eps, max_iter</text>
  </g>

  <rect x="710" y="500" width="260" height="150" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
  <g text-anchor="middle">
    <text class="mono" x="840" y="535" style="font-size:18px;font-weight:700;fill:#0C447C">ler_funcao(texto)</text>
    <text class="mono" x="840" y="562" style="font-size:13px;fill:#185FA5">sympify → diff → lambdify</text>
    <line x1="730" y1="578" x2="950" y2="578" stroke="#B5D4F4" stroke-width="1"/>
    <text x="840" y="603" style="font-size:15px;font-weight:700;fill:#0C447C">texto vira f(x) e f'(x)</text>
    <text x="840" y="626" class="peq">derivada calculada pelo sympy</text>
  </g>

  <!-- ===== 4 · MÉTODOS ===== -->
  <rect x="1030" y="200" width="280" height="640" rx="14" fill="#FAFAFE" stroke="#534AB7" stroke-width="2" stroke-dasharray="8 6"/>
  <g text-anchor="middle">
    <text class="mono" x="1170" y="232" style="font-size:18px;font-weight:700;fill:#3C3489">rodar_com_seguranca()</text>
    <text x="1170" y="254" class="peq">chama cada método e captura erros</text>
  </g>

  <text x="1050" y="288" style="font-size:13px;font-weight:700;fill:#3B6D11">Métodos de intervalo</text>
  <g text-anchor="middle">
    <rect x="1050" y="298" width="240" height="70" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
    <text class="mono" x="1170" y="328" style="font-size:17px;font-weight:700;fill:#27500A">bisseccao()</text>
    <text x="1170" y="352" class="peq">usa f, a, b</text>
    <rect x="1050" y="380" width="240" height="70" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
    <text class="mono" x="1170" y="410" style="font-size:17px;font-weight:700;fill:#27500A">falsa_posicao()</text>
    <text x="1170" y="434" class="peq">usa f, a, b</text>
  </g>

  <text x="1050" y="480" style="font-size:13px;font-weight:700;fill:#0F6E56">Métodos abertos</text>
  <g text-anchor="middle">
    <rect x="1050" y="490" width="240" height="70" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2"/>
    <text class="mono" x="1170" y="520" style="font-size:17px;font-weight:700;fill:#085041">newton_raphson()</text>
    <text x="1170" y="544" class="peq">usa f, f', x0</text>
    <rect x="1050" y="572" width="240" height="70" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2"/>
    <text class="mono" x="1170" y="602" style="font-size:17px;font-weight:700;fill:#085041">secante()</text>
    <text x="1170" y="626" class="peq">usa f, x0, x1</text>
    <line x1="1170" y1="642" x2="1170" y2="660" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="1070" y="660" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="mono" x="1170" y="685" style="font-size:13px;fill:#085041">_fora_do_intervalo()</text>
    <text class="mono" x="1170" y="705" style="font-size:13px;fill:#085041">_montar_aviso()</text>
    <text x="1170" y="727" class="peq">aviso de extrapolação</text>
  </g>
  <text x="1170" y="800" text-anchor="middle" class="peq">se um método quebrar, vira um</text>
  <text x="1170" y="818" text-anchor="middle" class="peq">Resultado com erro (não trava)</text>

  <!-- ===== 5 · RESULTADO ===== -->
  <rect x="1370" y="250" width="230" height="450" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
  <g text-anchor="middle">
    <text class="mono" x="1485" y="290" style="font-size:22px;font-weight:700;fill:#633806">Resultado</text>
    <text x="1485" y="314" class="peq">resultado.py · 1 por método</text>
  </g>
  <line x1="1390" y1="330" x2="1580" y2="330" stroke="#EF9F27" stroke-width="1"/>
  <g class="mono" style="font-size:15px;fill:#633806">
    <text x="1392" y="362">metodo</text>
    <text x="1392" y="394">raiz</text>
    <text x="1392" y="426">iteracoes</text>
    <text x="1392" y="458">tempo_ms</text>
    <text x="1392" y="490">residuo</text>
    <text x="1392" y="522">erro</text>
    <text x="1392" y="554">aviso</text>
    <text x="1392" y="586">historico</text>
  </g>
  <g text-anchor="end" class="peq">
    <text x="1580" y="362">nome</text>
    <text x="1580" y="394">x encontrado</text>
    <text x="1580" y="426">quantas</text>
    <text x="1580" y="458">tempo</text>
    <text x="1580" y="490">|f(raiz)|</text>
    <text x="1580" y="522">falha</text>
    <text x="1580" y="554">extrapolação</text>
    <text x="1580" y="586">x a cada passo</text>
  </g>
  <line x1="1390" y1="610" x2="1580" y2="610" stroke="#EF9F27" stroke-width="1"/>
  <g text-anchor="middle">
    <text class="mono" x="1485" y="645" style="font-size:16px;font-weight:700;fill:#633806">list[Resultado]</text>
    <text x="1485" y="668" class="peq">os 4 juntos, para comparar</text>
  </g>

  <!-- ===== 6 · SAÍDA ===== -->
  <g text-anchor="middle">
    <rect x="1660" y="230" width="220" height="80" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="2"/>
    <text class="mono" x="1770" y="266" style="font-size:16px;font-weight:700;fill:#712B13">imprimir_tabela()</text>
    <text x="1770" y="290" class="peq">relatorio.py</text>

    <rect x="1670" y="330" width="200" height="48" rx="24" fill="#2C2C2A"/>
    <text x="1770" y="359" style="font-size:15px;font-weight:700;fill:#FFFFFF">Tabela no terminal</text>

    <text x="1770" y="425" style="font-size:13px;font-style:italic;fill:#5F5E5A">"Abrir janela? (S/n)"</text>

    <rect x="1660" y="435" width="220" height="70" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="2"/>
    <text class="mono" x="1770" y="465" style="font-size:16px;font-weight:700;fill:#712B13">mostrar_janela()</text>
    <text x="1770" y="488" class="peq">recebe f, a, b e resultados</text>

    <rect x="1660" y="525" width="220" height="60" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="2"/>
    <text class="mono" x="1770" y="560" style="font-size:16px;font-weight:700;fill:#712B13">criar_figura()</text>

    <rect x="1660" y="605" width="220" height="110" rx="12" fill="#FFFFFF" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="mono" x="1770" y="637" style="font-size:13px;fill:#712B13">_desenhar_tabela()</text>
    <text class="mono" x="1770" y="664" style="font-size:13px;fill:#712B13">_desenhar_funcao()</text>
    <text class="mono" x="1770" y="691" style="font-size:13px;fill:#712B13">_desenhar_convergencia()</text>

    <rect x="1670" y="735" width="200" height="48" rx="24" fill="#2C2C2A"/>
    <text x="1770" y="764" style="font-size:15px;font-weight:700;fill:#FFFFFF">Janela com gráficos</text>
  </g>

  <!-- ===== Legenda ===== -->
  <line x1="40" y1="900" x2="1880" y2="900" stroke="#D3D1C7" stroke-width="1"/>
  <text x="40" y="950" style="font-size:15px;font-weight:700;fill:#5F5E5A">Cor = arquivo:</text>
  <g style="font-size:15px">
    <rect x="170" y="936" width="18" height="18" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
    <text class="mono" x="196" y="950">main.py</text>
    <rect x="300" y="936" width="18" height="18" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="2"/>
    <text class="mono" x="326" y="950">casos.py</text>
    <rect x="440" y="936" width="18" height="18" rx="4" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
    <text class="mono" x="466" y="950">entrada.py</text>
    <rect x="600" y="936" width="18" height="18" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
    <text class="mono" x="626" y="950">metodos_intervalo.py</text>
    <rect x="850" y="936" width="18" height="18" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2"/>
    <text class="mono" x="876" y="950">metodos_abertos.py</text>
    <rect x="1080" y="936" width="18" height="18" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
    <text class="mono" x="1106" y="950">resultado.py</text>
    <rect x="1250" y="936" width="18" height="18" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="2"/>
    <text class="mono" x="1276" y="950">relatorio.py</text>
  </g>
  <text x="40" y="995" class="sub">Cada seta é um dado passando de uma função para a próxima. Caixas tracejadas = funções auxiliares chamadas lá dentro.</text>
</svg>
